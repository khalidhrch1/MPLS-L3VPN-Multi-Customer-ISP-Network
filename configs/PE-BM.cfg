! ============================================================
! PE-BM - Provider Edge Router
! MPLS L3VPN Multi-Customer ISP Network
! Author: Khalid HARCHAOUI
! ============================================================

hostname PE-BM

ip cef

! ============================================================
! VRF CONFIGURATION
! ============================================================

ip vrf BMCE
 rd 65000:2
 route-target export 65000:2
 route-target import 65000:2

ip vrf CIH
 rd 65000:1
 route-target export 65000:1
 route-target import 65000:1

! ============================================================
! MPLS / LDP GLOBAL CONFIGURATION
! ============================================================

mpls label protocol ldp
mpls ldp router-id Loopback0 force

! ============================================================
! LOOPBACK
! ============================================================

interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 ip router isis CORE

! ============================================================
! MPLS CORE LINK
! PE-BM <-> P
! ============================================================

interface FastEthernet0/0
 description TO-P
 ip address 10.0.1.2 255.255.255.252
 ip router isis CORE
 duplex half
 mpls ip

! ============================================================
! CIH CUSTOMER LINK
! ============================================================

interface FastEthernet1/0
 ip vrf forwarding CIH
 ip address 172.16.20.1 255.255.255.252
 duplex auto
 speed auto

! ============================================================
! BMCE CUSTOMER LINK
! ============================================================

interface FastEthernet1/1
 ip vrf forwarding BMCE
 ip address 172.16.40.1 255.255.255.252
 duplex auto
 speed auto

! ============================================================
! OSPF - CIH
! ============================================================

router ospf 10 vrf CIH
 router-id 10.10.20.10
 log-adjacency-changes
 redistribute bgp 65000 subnets
 network 172.16.20.0 0.0.0.3 area 0

! ============================================================
! OSPF - BMCE
! ============================================================

router ospf 20 vrf BMCE
 router-id 20.20.40.10
 log-adjacency-changes
 redistribute bgp 65000 subnets
 network 172.16.40.0 0.0.0.3 area 0

! ============================================================
! IS-IS PROVIDER BACKBONE
! ============================================================

router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only

! ============================================================
! MP-BGP
! ============================================================

router bgp 65000
 no synchronization
 bgp log-neighbor-changes

 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source Loopback0

 no auto-summary

 address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community extended
 exit-address-family

 address-family ipv4 vrf CIH
  redistribute connected
  redistribute ospf 10 vrf CIH
  no synchronization
 exit-address-family

 address-family ipv4 vrf BMCE
  redistribute connected
  redistribute ospf 20 vrf BMCE
  no synchronization
 exit-address-family

! ============================================================
! END OF PE-BM CONFIGURATION
! ============================================================
