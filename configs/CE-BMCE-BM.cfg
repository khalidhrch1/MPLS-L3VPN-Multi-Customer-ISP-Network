! ============================================================
! CE-BMCE-BM - Customer Edge Router
! Customer: BMCE
! Site: Beni Mellal
! MPLS L3VPN Multi-Customer ISP Network
! Author: Khalid HARCHAOUI
! ============================================================

hostname CE-BMCE-BM

ip cef

! ============================================================
! WAN LINK TO PE-BM
! ============================================================

interface FastEthernet0/0
 ip address 172.16.40.2 255.255.255.252
 duplex half

! ============================================================
! CUSTOMER LAN
! ============================================================

interface FastEthernet1/0
 ip address 192.168.40.1 255.255.255.0
 duplex auto
 speed auto

! ============================================================
! OSPF CE-PE ROUTING
! ============================================================

router ospf 20
 router-id 20.20.40.1
 log-adjacency-changes
 network 172.16.40.0 0.0.0.3 area 0
 network 192.168.40.0 0.0.0.255 area 0

! ============================================================
! END OF CE-BMCE-BM CONFIGURATION
! ============================================================
