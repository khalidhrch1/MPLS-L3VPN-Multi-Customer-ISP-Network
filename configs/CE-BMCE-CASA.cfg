! ============================================================
! CE-BMCE-CASA - Customer Edge Router
! Customer: BMCE
! Site: Casablanca
! MPLS L3VPN Multi-Customer ISP Network
! Author: Khalid HARCHAOUI
! ============================================================

hostname CE-BMCE-CASA

ip cef

! ============================================================
! WAN LINK TO PE-CASA
! ============================================================

interface FastEthernet0/0
 ip address 172.16.30.2 255.255.255.252
 duplex half

! ============================================================
! CUSTOMER LAN
! ============================================================

interface FastEthernet1/0
 ip address 192.168.30.1 255.255.255.0
 duplex auto
 speed auto

! ============================================================
! OSPF CE-PE ROUTING
! ============================================================

router ospf 20
 router-id 20.20.30.1
 log-adjacency-changes
 network 172.16.30.0 0.0.0.3 area 0
 network 192.168.30.0 0.0.0.255 area 0

! ============================================================
! END OF CE-BMCE-CASA CONFIGURATION
! ============================================================
