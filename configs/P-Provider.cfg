! ============================================================
! P - Provider Core Router
! MPLS L3VPN Multi-Customer ISP Network
! Author: Khalid HARCHAOUI
! ============================================================

hostname P

ip cef

! ============================================================
! MPLS / LDP GLOBAL CONFIGURATION
! ============================================================

mpls label protocol ldp
mpls ldp router-id Loopback0 force

! ============================================================
! LOOPBACK
! ============================================================

interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ip router isis CORE

! ============================================================
! CORE LINK TO PE-CASA
! ============================================================

interface FastEthernet0/0
 description TO-PE-CASA
 ip address 10.0.0.1 255.255.255.252
 ip router isis CORE
 duplex half
 mpls ip

! ============================================================
! CORE LINK TO PE-BM
! ============================================================

interface FastEthernet1/0
 description TO-PE-BM
 ip address 10.0.1.1 255.255.255.252
 ip router isis CORE
 duplex auto
 speed auto
 mpls ip

! ============================================================
! IS-IS PROVIDER BACKBONE
! ============================================================

router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only

! ============================================================
! END OF P CONFIGURATION
! ============================================================
